# vcs-rag demo override — "start in 5 minutes", fully containerized:
# Qdrant + NATS + Ollama (with a one-shot bge-m3 pull) + worker + MCP.
# No host networking, no local Ollama, no token (public GitHub org).
#
#   cp .env.example .env
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d
#
# The base docker-compose.yml stays the "Deploy example"; this file only
# overrides the embeddings endpoint/dependencies and adds Ollama.
services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 24
    restart: unless-stopped

  # one-shot: pulls the embedding model once, then exits
  ollama-pull:
    image: ollama/ollama:latest
    command: ["pull", "bge-m3"]
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  worker:
    environment:
      # public GitHub org from .env(.example); the empty GitLab variables keep
      # the GitLab flavor off (the config requires exactly one provider)
      GITLAB_GROUP_ID: ""
      GITLAB_TOKEN: ""
      GITHUB_ORG: "${GITHUB_ORG:-gorizond}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      EMBEDDINGS_BASE_URL: "http://ollama:11434"
    depends_on:
      - nats
      - qdrant
      - ollama

  mcp:
    environment:
      EMBEDDINGS_BASE_URL: "http://ollama:11434"
    depends_on:
      - nats
      - qdrant
      - ollama

volumes:
  ollama-data:
